<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVIX Database Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MOVIX Admin Dashboard</h1>
        <p>Database Connectivity Test</p>
    </header>

    <div class="container">
        <div class="card">
            <h2>Add New User</h2>
            <p><i>Tests Stored Procedure: <code>add_user</code></i></p>
            <form id="addUserForm">
                <input type="text" id="username" placeholder="Username" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password Hash" required>
                <select id="subId">
                    <option value="1">Basic Plan (ID: 1)</option>
                    <option value="2">Standard Plan (ID: 2)</option>
                    <option value="3">Premium Plan (ID: 3)</option>
                </select>
                <button type="submit">Add User</button>
            </form>
            <div id="addMessage" class="message"></div>
        </div>

        <div class="card">
            <h2>All Users</h2>
            <p><i>Tests Table: <code>Users</code></i></p>
            <button onclick="fetchUsers()">Refresh User List</button>
            <div id="userList" class="data-box"></div>
        </div>

        <div class="card">
            <h2>Top Rated Content</h2>
            <p><i>Tests Procedure: <code>top_rated_by_genre</code></i></p>
            <input type="text" id="genreInput" placeholder="Enter Genre (e.g. Sci-Fi, Action)">
            <button onclick="fetchTopContent()">Get Content</button>
            <div id="contentList" class="data-box"></div>
        </div>

        <div class="card">
            <h2>Top Watchers (Analytics)</h2>
            <p><i>Tests View: <code>top_users</code></i></p>
            <button onclick="fetchAnalytics()">Load Top Users</button>
            <div id="analyticsList" class="data-box"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        // 1. ADD USER
        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                subscription_id: document.getElementById('subId').value
            };

            try {
                const res = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                document.getElementById('addMessage').innerText = result.message || 'Error adding user';
                fetchUsers(); // Refresh list
            } catch (err) {
                console.error(err);
            }
        });

        // 2. FETCH USERS
        async function fetchUsers() {
            const res = await fetch(`${API_URL}/users`);
            const users = await res.json();
            let html = '<table><tr><th>ID</th><th>User</th><th>Email</th><th>Plan ID</th></tr>';
            users.forEach(u => {
                html += `<tr><td>${u.user_id}</td><td>${u.username}</td><td>${u.email}</td><td>${u.subscription_id}</td></tr>`;
            });
            html += '</table>';
            document.getElementById('userList').innerHTML = html;
        }

        // 3. FETCH TOP CONTENT
        async function fetchTopContent() {
            const genre = document.getElementById('genreInput').value || 'Action';
            const res = await fetch(`${API_URL}/content/top/${genre}`);
            const content = await res.json();
            
            if(content.length === 0) {
                document.getElementById('contentList').innerHTML = "No content found for this genre.";
                return;
            }

            let html = '<table><tr><th>Title</th><th>Rating</th></tr>';
            content.forEach(c => {
                html += `<tr><td>${c.title}</td><td>${c.rating}</td></tr>`;
            });
            html += '</table>';
            document.getElementById('contentList').innerHTML = html;
        }

        // 4. FETCH ANALYTICS (VIEW)
        async function fetchAnalytics() {
            const res = await fetch(`${API_URL}/analytics/top-users`);
            const data = await res.json();
            let html = '<table><tr><th>Username</th><th>Total Watch Minutes</th></tr>';
            data.forEach(d => {
                html += `<tr><td>${d.username}</td><td>${d.total_watch_time}</td></tr>`;
            });
            html += '</table>';
            document.getElementById('analyticsList').innerHTML = html;
        }
    </script>
</body>
</html>
